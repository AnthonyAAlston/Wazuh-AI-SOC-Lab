services:
  netalertx:
    image: ghcr.io/netalertx/netalertx:latest
    container_name: netalertx
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - NET_BIND_SERVICE
    volumes:
      - /opt/netalertx/data:/data
      - /etc/localtime:/etc/localtime:ro
    tmpfs:
      - /tmp:uid=20211,gid=20211,mode=1700
    environment:
      PORT: "20211"
      LISTEN_ADDR: "192.168.1.245"
      APP_CONF_OVERRIDE: >-
        {"GRAPHQL_PORT":"20212","SCAN_SUBNETS":"['192.168.1.0/24 --interface=ens33']","API_TOKEN":"REPLACE_WITH_SECRET"}
